# Sample Fly.io config. Edit `app` to a unique name before deploying.
app = "follow-your-love"
primary_region = "syd"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[mounts]
  source = "fyl_data"
  destination = "/data"
